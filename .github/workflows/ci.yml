name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci
          npm ci --prefix functions
          npm install -g firebase-tools
      - name: Unit tests (engine, validation, AI tools, UTF-8)
        run: npm test
      - name: Functions build
        run: npm --prefix functions test
      - name: Emulator config (fake owner, fake Claude — no secrets, no cost)
        run: |
          printf 'OWNER_EMAIL=owner@example.com\nCLAUDE_FAKE=1\n' > functions/.env.local
          printf 'ANTHROPIC_API_KEY=fake-key-for-emulator\n' > functions/.secret.local
      - name: Security rules tests
        run: npm run test:rules
      - name: End-to-end tests on emulators
        run: npm run test:integration
